<!doctype html>
{% load static %}
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <script src="https://cdn.tailwindcss.com"></script>
   </head>
   <body class="min-h-screen flex items-center justify-center" style="background: #edf2f7;">
      <div class="min-h-screen bg-gradient-to-tl from-purple-400 to-indigo-900 w-full py-1 px-4">
         <div class="flex flex-col items-center justify-center">
            <div class="bg-white shadow rounded lg:w-1/3  md:w-1/2 w-full p-10 mt-16">
                <!-- logo -->
                <a href="#" class="flex items-center mb-6 text-2xl font-semibold text-gray-900 dark:text-purple">
                    <img class="w-8 h-8 mr-2" src="{% static 'images/logo-icon-socialink.png' %}" alt="logo">
                    SociaLink    
                </a>
               <p tabindex="0" class="focus:outline-none text-sm mt-4 font-medium leading-none text-gray-500">Create Account With SociaLink</p> 
               <div class="w-full flex items-center justify-between py-5">
                  <hr class="w-full bg-purple-800">
               </div>
                <form method="POST" action="{% url 'signUp' %}" class="space-y-3">
                    {% csrf_token %}
                    {% for field in user_form %}
                       {% if field.name == 'username' %}
                          <input class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-100 dark:border-gray-600 dark:placeholder-gray-400 dark:text-gray dark:focus:ring-blue-500 dark:focus:border-blue-500" id="{{ field.id_for_label }}" name="{{ field.name }}" type="{{ field.field.widget.input_type }}" autofocus="" placeholder="{{ field.label }}" required="">
                       {% elif field.name == 'email' %}
                          <input class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-100 dark:border-gray-600 dark:placeholder-gray-400 dark:text-gray dark:focus:ring-blue-500 dark:focus:border-blue-500" id="{{ field.id_for_label }}" name="{{ field.name }}" type="{{ field.field.widget.input_type }}" autofocus="" placeholder="{{ field.label }}" required="">
                       {% elif field.name == 'password1' %}
                          <input class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-100 dark:border-gray-600 dark:placeholder-gray-400 dark:text-gray dark:focus:ring-blue-500 dark:focus:border-blue-500" id="{{ field.id_for_label }}" name="{{ field.name }}" type="{{ field.field.widget.input_type }}" autofocus="" placeholder="{{ field.label }}" required="">
                       {% elif field.name == 'password2' %}
                          <input class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-100 dark:border-gray-600 dark:placeholder-gray-400 dark:text-gray dark:focus:ring-blue-500 dark:focus:border-blue-500" id="{{ field.id_for_label }}" name="{{ field.name }}" type="{{ field.field.widget.input_type }}" autofocus="" placeholder="{{ field.label }}" required="">
                       {% endif %}
                    {% endfor %}
                    <div class="space-x-2 text-sm text-center text-slate-400 dark:text-purple/70">
                    <div class="mt-8">
                        <button type="submit" class="text-white bg-gradient-to-br from-purple-400 to-indigo-900 hover:bg-gradient-to-bl focus:ring-4 focus:outline-none focus:ring-blue-300 dark:focus:ring-purple-200 font-medium rounded-lg text-sm px-5 py-2.5 text-center me-2 mb-2 w-full">Create Account</button>
                    </div>
                    <div class="space-x-2 text-sm text-center text-slate-400 dark:text-gray/70">
                       <span> Have an account? </span>
                       <a href="{% url 'signIn' %}" class="text-blue-600 hover:text-gray-500">Login</a>
                    </div>
                </form>

            </div>
         </div>
      </div>
   </body>
</html>
